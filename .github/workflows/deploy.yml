name: Deploy Quartz from Studied

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Prepare Quartz content from Studied
        run: |
          rm -rf content
          mkdir -p content
          rsync -av --delete --exclude ".DS_Store" Studied/ content/
          mkdir -p content/Resources
          rsync -av --exclude ".DS_Store" Resources/ content/Resources/
          if [ ! -f content/index.md ]; then
            cat > content/index.md <<'EOF'
          ---
          title: Home
          ---

          # Studied Notes

          Studied 전체를 자동 반영한 페이지입니다.
          EOF
          fi

      - name: Build Quartz
        run: npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
