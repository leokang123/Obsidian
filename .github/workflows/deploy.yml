name: Deploy Quartz from Studied

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Quartz content
        shell: bash
        run: |
          set -euo pipefail

          rm -rf content
          mkdir -p content

          # Studied 안의 markdown 파일을 frontmatter의 "주제" 기준으로 분류
          # 그리고 series 값으로 파일명 앞에 번호를 붙여 정렬되게 만듦
          find Studied -type f -name "*.md" | while IFS= read -r file; do
            subject=$(awk '
              BEGIN { in_yaml=0 }
              /^---[[:space:]]*$/ {
                if (in_yaml == 0) { in_yaml=1; next }
                else { exit }
              }
              in_yaml == 1 && $0 ~ /^주제:[[:space:]]*/ {
                sub(/^주제:[[:space:]]*/, "", $0)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
                print $0
                exit
              }
            ' "$file")

            if [ -z "${subject:-}" ]; then
              subject="기타"
            fi

            series=$(awk '
              BEGIN { in_yaml=0 }
              /^---[[:space:]]*$/ {
                if (in_yaml == 0) { in_yaml=1; next }
                else { exit }
              }
              in_yaml == 1 && $0 ~ /^series:[[:space:]]*/ {
                sub(/^series:[[:space:]]*/, "", $0)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $0)
                print $0
                exit
              }
            ' "$file")

            if [ -z "${series:-}" ]; then
              series="999"
            fi

            # series가 숫자가 아니면 기본값으로 뒤로 보냄
            if ! [[ "$series" =~ ^[0-9]+$ ]]; then
              series="999"
            fi

            printf -v series_padded "%03d" "$series"

            mkdir -p "content/$subject"

            target="content/$subject/${series_padded} $(basename "$file")"

            # 같은 최종 경로가 생기면 덮어쓰기 대신 실패시켜 충돌을 드러냄
            if [ -e "$target" ]; then
              echo "Duplicate target detected: $target"
              exit 1
            fi

            cp "$file" "$target"
          done

          # 첨부 이미지 파일들을 content 루트에 복사
          # ![[Pasted image ....png]] 형태를 최대한 살리기 위한 처리
          if [ -d "Resources/Attachments" ]; then
            rsync -av --exclude ".DS_Store" Resources/Attachments/ content/
          fi

          # banner 등에서 참조할 수 있게 Resources 전체도 보존
          if [ -d "Resources" ]; then
            rsync -av --exclude ".DS_Store" Resources/ content/Resources/
          fi

          # 홈 파일 생성
          cat > content/index.md <<'EOF'
          ---
          title: Home
          date: 2026-04-02
          ---

          # Jeonghoon Notes

          주제 기준으로 자동 정리된 노트입니다.
          EOF

      - name: Build Quartz
        run: npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
