name: Deploy Quartz from Studied

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Prepare Quartz content
        run: |
          rm -rf content
          mkdir -p content

          # Studied 전체를 Quartz content로 복사
          rsync -av --delete --exclude ".DS_Store" Studied/ content/

          # 첨부 이미지 파일을 content 루트에도 복사
          # ![[Pasted image ....png]] 같은 파일명 링크를 최대한 살리기 위한 처리
          if [ -d "Resources/Attachments" ]; then
            rsync -av --exclude ".DS_Store" Resources/Attachments/ content/
          fi

          # 홈 파일이 없으면 기본 홈 생성
          if [ ! -f content/index.md ]; then
            cat > content/index.md <<'EOF'
          ---
          title: Home
          ---

          # Studied Notes

          Studied 전체를 자동 반영한 페이지입니다.
          EOF
          fi

      - name: Build Quartz
        run: npx quartz build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
